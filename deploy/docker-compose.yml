services:
  postgres:
    image: postgres:16-alpine
    container_name: go-ecommerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: product_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../services/product/migrations/000001_create_products_table.up.sql:/docker-entrypoint-initdb.d/001_init_products.sql:ro
      - ../services/order/migrations/000001_create_orders_tables.up.sql:/docker-entrypoint-initdb.d/002_init_orders.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d product_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
